name: Windows-App erstellen
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
    paths: ['desktop/**', 'app/src/main/assets/**', 'tests/**', '.github/workflows/build-windows.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npm run dist
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Gepackte App mit echter Messung prüfen
        shell: pwsh
        run: |
          $fixture = (Resolve-Path tests/fixtures/profile.json).Path
          $output = Join-Path $PWD 'smoke-output'
          $process = Start-Process desktop/dist/win-unpacked/AtmosphaerenLabor.exe -WindowStyle Hidden -Wait -PassThru -ArgumentList '--smoke-test', "--smoke-fixture=`"$fixture`"", "--smoke-output=`"$output`""
          if ($process.ExitCode -ne 0) { throw 'Windows start test failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: AtmosphaerenLabor-Windows-x64
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-Startpruefung
          path: smoke-output/

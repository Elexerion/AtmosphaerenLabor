name: DWD BUFR decoder test
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/test-dwd-bufr.yml'
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - name: Install ecCodes tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-tools python3-eccodes
      - name: Download sample from DWD
        run: |
          curl --fail --location --retry 3 --max-time 90 \
            'https://opendata.dwd.de/weather/weather_reports/radiosonde/bufr/Z__C_EDZW_20261024011702_bda01,temp_bufr_999999_999999__MW_469.bin' \
            --output sample.bin
          ls -lh sample.bin
          file sample.bin
      - name: Inspect BUFR headers and station identifiers
        run: |
          echo 'Message count:'
          bufr_count sample.bin
          echo 'BUFR headers:'
          bufr_ls -p edition,typicalDate,typicalTime,dataCategory,numberOfSubsets,compressedData sample.bin
          echo 'Station identifiers and available fields (best effort):'
          for key in blockNumber stationNumber wigosIdentifier latitude longitude pressure airTemperature dewpointTemperature geopotentialHeight; do
            echo "KEY: $key"
            bufr_get -p "$key" sample.bin || true
          done
      - name: Decode and preserve JSON output
        run: |
          bufr_dump -j -p sample.bin > decoded.json
          du -h decoded.json
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dwd-bufr-diagnostics
          path: |
            sample.bin
            decoded.json
          if-no-files-found: warn

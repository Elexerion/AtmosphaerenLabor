name: DWD BUFR decoder test
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/test-dwd-bufr.yml'
      - 'tools/dwd_profiles.py'
      - 'tests/**'
permissions:
  contents: read
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install eccodes==2.50.0
      - name: Echte Referenzmessung, Stationskennung und Subsets prüfen
        run: python -m unittest discover -s tests -v
      - name: Aktuelles DWD-Aufstiegsprofil für WMO 10035 suchen
        run: python tools/dwd_profiles.py --output profiles
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dwd-verified-profiles
          path: profiles/
          if-no-files-found: warn
